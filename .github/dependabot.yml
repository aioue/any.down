# Dependabot version updates for uv, Docker base images, and GitHub Actions.
# Security alerts are enabled at the repo level (Settings → Code security).

version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Stay on Python 3.13 until explicitly tested (see requires-python in pyproject.toml).
      - dependency-name: python
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
